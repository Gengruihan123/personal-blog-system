server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:blog_user}
    password: ${DB_PASSWORD:blog_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

logging:
  level:
    org.hibernate.SQL: warn
