<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理后台 - 我的个人博客</title>
  <script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{primary:'#3B82F6',dark:'#1F2937'}}}}</script>
</head><body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow-sm sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center"><a href="index.html" class="font-bold text-xl mr-auto"><i class="fa fa-pencil-square-o text-primary mr-2"></i>博客管理后台</a><button id="logout" class="text-gray-600 hover:text-primary">退出登录</button></div></header>
  <div class="max-w-7xl mx-auto p-4 py-8 grid lg:grid-cols-[210px_1fr] gap-6"><aside class="bg-dark text-gray-300 rounded-xl p-3 h-fit"><button data-view="overview" class="nav w-full text-left px-4 py-3 rounded-lg bg-blue-600 text-white">数据概览</button><button data-view="articles" class="nav w-full text-left px-4 py-3 rounded-lg">文章管理</button><button data-view="comments" class="nav w-full text-left px-4 py-3 rounded-lg">评论管理</button><button data-view="taxonomy" class="nav w-full text-left px-4 py-3 rounded-lg">分类与标签</button></aside><main id="admin-content"><div class="bg-white rounded-xl p-10 text-center text-gray-500">正在加载...</div></main></div>
  <dialog id="article-dialog" class="w-full max-w-3xl rounded-xl p-0 backdrop:bg-black/50"><form id="article-form" class="p-7 space-y-4"><div class="flex"><h2 class="text-2xl font-bold mr-auto">编辑文章</h2><button type="button" data-close class="text-2xl">×</button></div><input id="article-id" type="hidden"><input id="article-version" type="hidden"><input id="title" required maxlength="150" placeholder="文章标题" class="w-full px-4 py-3 border rounded-lg"><textarea id="summary" maxlength="500" placeholder="文章摘要" class="w-full px-4 py-3 border rounded-lg"></textarea><textarea id="content" required rows="12" placeholder="正文，支持 HTML" class="w-full px-4 py-3 border rounded-lg font-mono"></textarea><div class="grid md:grid-cols-2 gap-4"><select id="category" class="px-4 py-3 border rounded-lg"></select><select id="status" class="px-4 py-3 border rounded-lg"><option value="DRAFT">草稿</option><option value="PUBLISHED">发布</option></select></div><input id="cover" placeholder="封面图片地址" class="w-full px-4 py-3 border rounded-lg"><div id="tag-checks" class="flex flex-wrap gap-3"></div><button class="bg-primary text-white px-6 py-3 rounded-lg">保存文章</button></form></dialog>
  <script type="module" src="/js/config.js"></script><script type="module" src="/js/admin.js"></script>
</body></html>
