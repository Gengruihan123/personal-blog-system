<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>登录 - 我的个人博客</title>
  <script src="https://cdn.tailwindcss.com"></script><link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#3B82F6',dark:'#1F2937'}}}}</script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <a href="index.html" class="flex items-center text-xl font-bold text-dark mb-8"><i class="fa fa-pencil-square-o text-primary text-2xl mr-2"></i>我的博客</a>
    <h1 class="text-3xl font-bold text-gray-900 mb-2">欢迎回来</h1><p class="text-gray-500 mb-7">登录后可发表评论和进入管理后台</p><div id="message"></div>
    <form id="login-form" class="space-y-5">
      <label class="block"><span class="font-medium">用户名</span><input name="username" required class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40"></label>
      <label class="block"><span class="font-medium">密码</span><input name="password" type="password" required class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40"></label>
      <button class="w-full bg-primary text-white font-medium py-3 rounded-lg hover:bg-blue-600">登录</button>
    </form>
    <div class="mt-6 p-4 rounded-lg bg-blue-50 text-sm text-blue-800">管理员：admin / admin123<br>普通用户：user / user123</div>
  </main>
  <script type="module" src="/js/config.js"></script><script type="module" src="/js/auth.js"></script>
</body></html>
